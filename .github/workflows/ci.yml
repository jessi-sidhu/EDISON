# The app's checks. The app lives in Plugged/, so every step runs there.
# OFF (#165): the repo is private, the free Actions minutes
# ran out, and the gate is the local checks /ship and /promote run. Manual
# runs only. To turn it back on, put back the triggers it had:
#   on: { pull_request: , push: { branches: [main, dev] } }
# with Actions minutes available (a public repo, or an Actions budget).
name: CI
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Plugged

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Plugged/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  e2e:
    name: Browser tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Plugged/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: Plugged/test-results/
          retention-days: 7
