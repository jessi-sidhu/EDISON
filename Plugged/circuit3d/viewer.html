<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edison: Circuit Preview</title>
  <link rel="stylesheet" href="../edison/tokens.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #dcdad4; }
    #canvas-wrap { width: 100%; height: 100%; position: relative; }
    #canvas { display: block; width: 100%; height: 100%; }
    /* ?mode=hero (the Edison landing): opaque on the landing's black, and the
       board fades out into it towards the frame's edge */
    html[data-mode="hero"], html[data-mode="hero"] body { background: #101010; }
    html[data-mode="hero"] #canvas {
      -webkit-mask-image: radial-gradient(closest-side, #000 74%, transparent);
              mask-image: radial-gradient(closest-side, #000 74%, transparent);
    }
  </style>
  <script>if (new URLSearchParams(location.search).get('mode') === 'hero') document.documentElement.dataset.mode = 'hero';</script>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <!-- Edison UI flag; also gates ?circuit= below -->
  <script src="../edison/ui-flag.js"></script>

  <!-- Three.js r128 (same as main editor) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Parts registry, then every file in js/parts/index.js FILES -->
  <script src="js/parts/registry.js"></script>
  <script src="js/parts/resistor.js"></script>
  <script src="js/parts/led.js"></script>
  <script src="js/parts/battery.js"></script>
  <script src="js/parts/buzzer.js"></script>
  <script src="js/parts/button.js"></script>
  <script src="js/parts/potentiometer.js"></script>
  <script src="js/parts/ldr.js"></script>
  <script src="js/parts/thermistor.js"></script>
  <script src="js/parts/bench_supply.js"></script>
  <script src="js/parts/seven_segment.js"></script>
  <script src="js/parts/diode.js"></script>
  <script src="js/parts/zener.js"></script>
  <script src="js/parts/toggle_switch.js"></script>
  <script src="js/parts/slide_switch.js"></script>
  <script src="js/parts/bulb.js"></script>
  <script src="js/parts/motor.js"></script>
  <script src="js/parts/current_source.js"></script>
  <script src="js/parts/rgb_led.js"></script>
  <script src="js/parts/multimeter.js"></script>
  <script src="js/parts/capacitor.js"></script>
  <script src="js/parts/tl072.js"></script>
  <script src="js/parts/function_generator.js"></script>

  <!-- Reuse scene, breadboard, and component builders -->
  <script src="js/scene.js"></script>
  <script src="js/board-geometry.js"></script>
  <script src="js/breadboard.js"></script>
  <script src="js/components.js"></script>
  <script src="js/hero-model.js"></script>

  <script>
  (function () {
    const App = window.App;

    // ?mode=hero (the Edison landing, issues #163, #167, #171 and #174): the glass
    // board, the circuit drawn in as line art that solidifies and lights,
    // driven through window.Hero (js/hero-model.js); &stage=empty starts bare.
    const query = new URLSearchParams(location.search);
    const hero  = query.get('mode') === 'hero'
      ? HeroModel.create(App, { ink: query.get('ink'), reduced: matchMedia('(prefers-reduced-motion: reduce)').matches, stage: HeroModel.startStage(location.search) })
      : null;

    // The hero's bloom (#174): Three r128's post-processing, only in hero
    // mode, run in this order; resolves true once all are in, false if one
    // fails or they take over 4 s (a slow CDN costs the bloom, not the hero).
    const FX = 'https://unpkg.com/three@0.128.0/examples/js/';
    const fx = !hero ? null : Promise.race([
      Promise.all(['shaders/CopyShader', 'shaders/LuminosityHighPassShader', 'postprocessing/EffectComposer',
        'postprocessing/ShaderPass', 'postprocessing/RenderPass', 'postprocessing/UnrealBloomPass'].map(name => new Promise(resolve => {
        const s = document.createElement('script');
        s.src = FX + name + '.js';
        s.async = false;   // in order
        s.onload = () => resolve(true);
        s.onerror = () => resolve(false);
        document.head.appendChild(s);
      }))).then(all => all.every(Boolean)),
      new Promise(resolve => setTimeout(() => resolve(false), 4000)),
    ]);

    // ── Create breadboard and add to scene ──
    const bb = App.createBreadboard();
    App.scene.add(bb.group);
    if (hero) hero.board(bb);

    // ── Wire arc builder (replicated from app.js) ──
    function buildWireGroup(start, end, hexColor) {
      const g   = new THREE.Group();
      const mat = new THREE.MeshLambertMaterial({ color: hexColor });
      const LEG_H = 0.28;
      const legGeo = new THREE.CylinderGeometry(0.04, 0.04, LEG_H, 7);
      [start, end].forEach(p => {
        if (p.y > 0.15) return;
        const leg = new THREE.Mesh(legGeo, mat.clone());
        leg.position.set(p.x, -LEG_H / 2 + 0.06, p.z);
        g.add(leg);
      });
      const startY = start.y > 0.15 ? start.y : 0.06;
      const endY   = end.y   > 0.15 ? end.y   : 0.06;
      const dist = start.distanceTo(end);
      const mid  = new THREE.Vector3(
        (start.x + end.x) / 2,
        Math.max(startY, endY) + dist * 0.22 + 0.38,
        (start.z + end.z) / 2
      );
      const curve   = new THREE.CatmullRomCurve3([
        new THREE.Vector3(start.x, startY, start.z),
        mid,
        new THREE.Vector3(end.x,   endY,   end.z),
      ]);
      const tubeGeo = new THREE.TubeGeometry(curve, 26, 0.043, 7, false);
      const tube    = new THREE.Mesh(tubeGeo, mat.clone());
      tube.castShadow = true;
      g.add(tube);
      return g;
    }

    // ── Load ?circuit= (allow-listed) or demo.sparky, and render it ──
    const want = new URLSearchParams(location.search).get('circuit');
    const src  = want && UiFlag.allowedCircuit(want) ? `../${want}` : '../demo.sparky';
    const loading = fetch(src)
      .then(r => r.json())
      .then(data => {
        const components = [];
        if (hero) hero.circuit(data);   // its circuit paths, for the build-up (#171)

        // Place components
        for (const c of (data.components || [])) {
          let result = null;
          // Every part draws itself; a saved part with no values gets its defaults.
          const def = window.Parts && Parts.get(c.type);
          if (def && def.place.kind === 'offboard' && c.position) {
            // Drawn around (0, 0, 0), then moved to where it was saved.
            const built = App.buildPart(c.type, Parts.legsOf(c), c.values);
            built.group.position.set(c.position.x, 0, c.position.z);
            result = { group: built.group, pins: built.pinPositions.map(p => p.clone().add(built.group.position)) };
          } else if (def && def.place.kind !== 'offboard' && c.holeRefs?.length === def.pins.length) {
            const legs = Parts.legsOf(c);
            if (legs.every(l => bb.getHole(l.col, l.row))) {
              const built = App.buildPart(c.type, legs, c.values);
              result = { group: built.group, pins: built.pinPositions };
            }
          }
          if (result) {
            App.scene.add(result.group);
            if (hero) hero.part(def, result.group, c.label);
            components.push({ type: c.type, pins: result.pins });
          } else {
            components.push(null);
          }
        }

        // Draw wires
        for (const w of (data.wires || [])) {
          let startWorld = null, endWorld = null;
          const color = w.color ?? 0xef4444;

          if (w.startHole) {
            const h = bb.getHole(w.startHole.col, w.startHole.row);
            if (h) startWorld = h.world.clone();
          } else if (w.startCompIdx >= 0 && components[w.startCompIdx]) {
            const pins = components[w.startCompIdx].pins;
            if (pins[w.startPinIdx]) startWorld = pins[w.startPinIdx].clone();
          }

          if (w.endHole) {
            const h = bb.getHole(w.endHole.col, w.endHole.row);
            if (h) endWorld = h.world.clone();
          } else if (w.endCompIdx >= 0 && components[w.endCompIdx]) {
            const pins = components[w.endCompIdx].pins;
            if (pins[w.endPinIdx]) endWorld = pins[w.endPinIdx].clone();
          }

          if (startWorld && endWorld) {
            const wire = buildWireGroup(startWorld, endWorld, color);
            App.scene.add(wire);
            if (hero) hero.wire(wire, !!(w.startHole && w.endHole));
          }
        }
      });
    loading.catch(err => console.warn('Could not load ' + src + ':', err));
    if (hero) window.Hero = hero.start(loading, fx);

    // ── Render loop ──
    function animate() {
      requestAnimationFrame(animate);
      App.controls.update();
      if (hero) hero.render();   // through its bloom
      else App.renderer.render(App.scene, App.camera);
    }
    animate();

    // ── Slow auto-rotate for a showcase feel ──
    App.controls.autoRotate = true;
    App.controls.autoRotateSpeed = 0.8;

    // ?nozoom=1 (the textbook's figures): the wheel scrolls the page around the frame.
    if (new URLSearchParams(location.search).get('nozoom') === '1') App.controls.enableZoom = false;
  })();
  </script>
</body>
</html>
