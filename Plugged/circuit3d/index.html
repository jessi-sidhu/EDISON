<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body>

<div id="app">

  <!-- TOP BAR -->
  <header id="topbar">
    <div class="topbar-left-group">
      <a class="topbar-brand" href="../dashboard.html" title="Back to dashboard" style="text-decoration:none;color:inherit;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        Sparky
      </a>
      <span class="topbar-name-sep">·</span>
      <span id="circuit-name-field"
            contenteditable="true"
            spellcheck="false"
            title="Click to rename circuit"
            onblur="App.state.circuitName = this.textContent.trim() || 'Untitled'; this.textContent = App.state.circuitName; if(App.scheduleAutoSave) App.scheduleAutoSave();"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">Untitled</span>
    </div>

    <div class="topbar-center">
      <button class="btn-simulate" id="sim-run-btn" onclick="App.runSimulation()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        Run Simulation
      </button>
      <button class="btn-stop" id="sim-stop-btn" onclick="App.stopSimulation()" style="display:none">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <rect x="4" y="4" width="16" height="16"/>
        </svg>
        Stop
      </button>
    </div>

    <div class="topbar-actions">
      <button class="btn-secondary" onclick="App.saveCircuit()" title="Download circuit as .sparky file">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download
      </button>
    </div>
  </header>

  <!-- BODY -->
  <div id="body">

    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-section-label">Components</div>

      <button class="comp-item" data-type="resistor">
        <span class="comp-item-icon">
          <!-- Resistor: horizontal body + color bands + axial leads -->
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="14" x2="7" y2="14"/>
            <rect x="7" y="10" width="14" height="8" rx="1.5" fill="currentColor" fill-opacity="0.1"/>
            <rect x="7" y="10" width="14" height="8" rx="1.5"/>
            <line x1="11.5" y1="10" x2="11.5" y2="18"/>
            <line x1="14" y1="10" x2="14" y2="18"/>
            <line x1="16.5" y1="10" x2="16.5" y2="18"/>
            <line x1="21" y1="14" x2="27" y2="14"/>
          </svg>
        </span>
        <div class="comp-item-text">
          <span class="comp-item-name">Resistor</span>
          <span class="comp-item-sub">2 leads · axial</span>
        </div>
      </button>

      <button class="comp-item" data-type="led">
        <span class="comp-item-icon">
          <!-- LED: dome side profile + leads + light rays -->
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 19 C8 7, 20 7, 20 19 Z" fill="currentColor" fill-opacity="0.15"/>
            <path d="M8 19 C8 7, 20 7, 20 19"/>
            <line x1="6" y1="19" x2="22" y2="19"/>
            <line x1="10" y1="19" x2="10" y2="26"/>
            <line x1="18" y1="19" x2="18" y2="26"/>
            <line x1="22" y1="11" x2="25" y2="8" stroke-width="1.3"/>
            <line x1="22" y1="15" x2="26" y2="15" stroke-width="1.3"/>
          </svg>
        </span>
        <div class="comp-item-text">
          <span class="comp-item-name">LED</span>
          <span class="comp-item-sub">2 leads · 5mm</span>
        </div>
      </button>

      <button class="comp-item" data-type="battery">
        <span class="comp-item-icon">
          <!-- Battery: snap nub on top + rectangular body + +/- terminals -->
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="10" y="3" width="8" height="4" rx="1"/>
            <rect x="5" y="7" width="18" height="17" rx="2" fill="currentColor" fill-opacity="0.1"/>
            <rect x="5" y="7" width="18" height="17" rx="2"/>
            <line x1="9" y1="14" x2="12" y2="14" stroke-width="1.5"/>
            <line x1="10.5" y1="12.5" x2="10.5" y2="15.5" stroke-width="1.5"/>
            <line x1="16" y1="14" x2="19" y2="14" stroke-width="1.5"/>
          </svg>
        </span>
        <div class="comp-item-text">
          <span class="comp-item-name">Battery</span>
          <span class="comp-item-sub">9V · snap connector</span>
        </div>
      </button>

      <button class="comp-item" data-type="buzzer">
        <span class="comp-item-icon">
          <!-- Buzzer: cylinder side view (disc) with + polarity mark + leads -->
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="14" cy="9" rx="9" ry="3"/>
            <line x1="5" y1="9" x2="5" y2="18"/>
            <line x1="23" y1="9" x2="23" y2="18"/>
            <path d="M5 18 A9 3 0 0 0 23 18" fill="currentColor" fill-opacity="0.1"/>
            <path d="M5 18 A9 3 0 0 0 23 18"/>
            <line x1="11" y1="9" x2="13.5" y2="9" stroke-width="1.3"/>
            <line x1="12.2" y1="7.8" x2="12.2" y2="10.2" stroke-width="1.3"/>
            <line x1="10" y1="21" x2="10" y2="26"/>
            <line x1="18" y1="21" x2="18" y2="26"/>
          </svg>
        </span>
        <div class="comp-item-text">
          <span class="comp-item-name">Buzzer</span>
          <span class="comp-item-sub">2 leads · active</span>
        </div>
      </button>

      <button class="comp-item" data-type="button">
        <span class="comp-item-icon">
          <!-- Push button: square base + round pressable cap on top + leads -->
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="14" width="16" height="10" rx="1.5" fill="currentColor" fill-opacity="0.1"/>
            <rect x="6" y="14" width="16" height="10" rx="1.5"/>
            <circle cx="14" cy="11" r="5" fill="currentColor" fill-opacity="0.15"/>
            <circle cx="14" cy="11" r="5"/>
            <line x1="9" y1="24" x2="9" y2="27"/>
            <line x1="19" y1="24" x2="19" y2="27"/>
          </svg>
        </span>
        <div class="comp-item-text">
          <span class="comp-item-name">Push Button</span>
          <span class="comp-item-sub">2 leads · momentary</span>
        </div>
      </button>

      <div class="sidebar-section-label" style="margin-top:12px;">Tools</div>

      <button class="comp-item" data-type="wire" id="wire-tool-btn">
        <span class="comp-item-icon">
          <!-- Wire: arc between two endpoint dots -->
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="4" cy="18" r="2" fill="currentColor"/>
            <path d="M4 18 C4 6, 24 6, 24 18"/>
            <circle cx="24" cy="18" r="2" fill="currentColor"/>
          </svg>
        </span>
        <div class="comp-item-text">
          <span class="comp-item-name">Wire</span>
          <span class="comp-item-sub">connect pins</span>
        </div>
      </button>

      <div class="sidebar-divider"></div>

      <div id="wire-color-row" style="display:none;">
        <div class="sidebar-section-label">Wire Color</div>
        <div class="color-swatches">
          <button class="swatch active" data-color="0xef4444" style="background:#ef4444" title="Red"></button>
          <button class="swatch" data-color="0xfbbf24" style="background:#fbbf24" title="Yellow"></button>
          <button class="swatch" data-color="0x22c55e" style="background:#22c55e" title="Green"></button>
          <button class="swatch" data-color="0x3b82f6" style="background:#3b82f6" title="Blue"></button>
          <button class="swatch" data-color="0x000000" style="background:#333" title="Black"></button>
          <button class="swatch" data-color="0xffffff" style="background:#e8e8e8;border:1px solid #ccc" title="White"></button>
        </div>
      </div>

      <div class="sidebar-help">
        <p><kbd>S</kbd> Select &nbsp;<kbd>P</kbd> Place &nbsp;<kbd>W</kbd> Wire</p>
        <p><kbd>R</kbd> Rotate &nbsp;<kbd>Del</kbd> Delete</p>
        <p><kbd>Esc</kbd> Cancel / deselect</p>
        <p><strong>Left-drag</strong> to orbit</p>
        <p><strong>Right-drag</strong> to pan camera</p>
        <p><strong>Scroll</strong> to zoom</p>
      </div>
    </aside>

    <!-- 3D CANVAS -->
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>

      <!-- Floating hint that appears contextually -->
      <div id="hint-box" class="hint-hidden">
        <span id="hint-text"></span>
      </div>

      <!-- Hover label for nearest hole -->
      <div id="hole-label"></div>

      <!-- Rotate indicator (shown in place mode) -->
      <div id="rotate-badge">
        <kbd>R</kbd> rotate
      </div>

      <!-- Clear All (hidden until board has content) -->
      <button id="clear-all-btn" title="Clear All" style="display:none" onclick="App.clearAll()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
        Clear All
      </button>

      <!-- Reset camera -->
      <button id="reset-cam-btn" title="Reset camera view" onclick="App.resetCamera()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        Reset View
      </button>
    </div>

    <!-- ── AI PANEL (right sidebar) ─────────────────────────── -->
    <div id="sparky-panel">

      <div id="sparky-messages">

        <!-- Welcome / empty state -->
        <div id="sparky-welcome">
          <div class="sparky-welcome-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
          </div>
          <div class="sparky-welcome-title">Sparky</div>
          <div class="sparky-welcome-sub">What would you like to build?</div>
          <div id="sparky-suggestions">
            <button class="sparky-suggest-btn" onclick="sparkyQuick('Build a complete working LED circuit from scratch. Place all the components and wires needed.', true)">⚡ Build an LED circuit</button>
            <button class="sparky-suggest-btn" onclick="sparkyQuick('Analyze my circuit and tell me if it will work correctly.', false)">🔍 Analyze my circuit</button>
            <button class="sparky-suggest-btn" onclick="sparkyQuick('What components or wires should I add to improve my circuit?', false)">🔧 What should I add?</button>
          </div>
        </div>

      </div>

      <!-- Pending-changes bar — shown when AI suggests edits awaiting review -->
      <div id="sparky-pending-bar" style="display:none">
        <button class="pending-accept" onclick="sparkyAcceptChanges()">Accept</button>
        <button class="pending-decline" onclick="sparkyDeclineChanges()">Decline</button>
      </div>

      <div id="sparky-input-row">
        <textarea id="sparky-input" rows="1" placeholder="Ask Sparky anything…"></textarea>
      </div>

    </div>

  </div>

  <!-- Load Preview Modal -->
  <div id="load-preview-modal" style="display:none">
    <div class="lpm-card">
      <div class="lpm-thumb">
        <img id="lpm-img" src="" alt="Circuit preview" style="display:none">
        <div id="lpm-placeholder">No preview available</div>
      </div>
      <div class="lpm-name" id="lpm-name"></div>
      <div class="lpm-meta" id="lpm-meta"></div>
      <div class="lpm-btns">
        <button class="btn-simulate" id="lpm-confirm">Load Circuit</button>
        <button class="btn-secondary" onclick="document.getElementById('load-preview-modal').style.display='none'">Cancel</button>
      </div>
    </div>
  </div>

</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- App modules (load in dependency order) -->
<!-- Parts registry, then every file in js/parts/index.js FILES, before the modules that read it -->
<script src="js/parts/registry.js"></script>
<script src="js/parts/resistor.js"></script>
<script src="js/scene.js"></script>
<script src="js/board-geometry.js"></script>
<script src="js/breadboard.js"></script>
<script src="js/components.js"></script>
<script src="js/interaction.js"></script>
<script src="js/simulate.js"></script>
<script src="js/storage.js"></script>
<script src="js/ids.js"></script>
<script src="js/history.js"></script>
<script src="js/board-io.js"></script>
<script src="js/app.js"></script>
<script src="js/chat.js"></script>

</body>
</html>
